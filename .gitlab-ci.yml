stages:
  - build
  - test

build:
  stage: build
  image: node:20
  script: 
    - npm install
    - npm run build
  artifacts: 
    paths: 
      - dist/
    expire_in: 1 hour

test:
  stage: test
  image: cypress/included:15.10.0
  script:
    - npm run generate-db
    - npm run start:json-server &
    - npm run dev &
    - npx cypress run --headless --browser=chrome
  artifacts:
    paths:
      - cypress/reports/
    when: always

    